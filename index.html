<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LireMonde </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="container nav-container">
            <a href="#" class="logo">
                <div class="logo-icon">📖</div>
                <div>
                    <h1 class="heading-font logo-title">LireMonde</h1>
                </div>
            </a>

            <div class="nav-links">
                <a href="#" class="nav-link active" id="nav-home">Accueil</a>
                <a href="#" class="nav-link" id="nav-reading">À lire</a>
                <a href="#" class="nav-link" id="nav-admin">Admin</a>
            </div>

            <div class="search-box">
                <input type="text" id="global-search" placeholder="Rechercher un livre..." />
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
            </div>
        </div>
    </nav>

    <div class="container main-container">

        <!-- HOME -->
        <div id="home-section">
            <div class="home-header">
                <h2 class="heading-font">Découvrez nos livres</h2>
                <div id="genre-filters"></div>
            </div>
            <div class="books-grid" id="books-grid"></div>
        </div>

        <!-- READING LIST -->
        <div id="reading-section" class="hidden">
            <h2 class="heading-font reading-header">Ma liste À lire</h2>
            <div class="books-grid" id="reading-grid"></div>
            <div id="empty-reading" class="hidden text-center empty-reading">
                <h3>Votre liste est vide</h3>
                <p>Ajoutez des livres pour les voir ici</p>
            </div>
        </div>

        <!-- ADMIN -->
        <div id="admin-section" class="hidden">
            <div class="admin-header">
                <h2 class="heading-font">Gestion des livres</h2>
                <button class="btn btn-primary">Ajouter un livre</button>
            </div>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Couverture</th>
                        <th>Titre</th>
                        <th>Auteur</th>
                        <th>Genre</th>
                        <th class="center">Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Book Detail Modal -->
    <div id="book-modal" class="modal-overlay">
        <div class="modal book-modal-inner">
            <div class="book-modal-cover">
                <img id="modal-image" alt="" />
            </div>
            <div class="book-modal-body">
                <div class="book-modal-top">
                    <div>
                        <h2 id="modal-title" class="heading-font book-modal-title"></h2>
                        <p id="modal-author" class="book-modal-author"></p>
                    </div>
                    <button class="book-modal-close-icon">×</button>
                </div>
                <span id="modal-genre" class="book-modal-genre"></span>
                <p id="modal-description" class="book-modal-description"></p>
                <div class="book-modal-actions">
                    <button id="modal-toggle-btn" class="book-modal-toggle-btn"></button>
                    <button class="book-modal-close-btn">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Form Modal -->
    <div id="admin-modal" class="modal-overlay">
        <div class="modal admin-modal-inner">
            <h3 id="admin-modal-title" class="heading-font admin-modal-title">Ajouter un livre</h3>
            <form id="book-form">
                <input type="hidden" id="edit-id" />
                <div class="form-fields">
                    <div class="form-group">
                        <label>Titre</label>
                        <input type="text" id="form-titre" required />
                    </div>
                    <div class="form-group">
                        <label>Auteur</label>
                        <input type="text" id="form-auteur" required />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Genre</label>
                            <select id="form-genre" required>
                                <option value="">Choisir...</option>
                                <option value="Classique">Classique</option>
                                <option value="Science-fiction">Science-fiction</option>
                                <option value="Fantasy">Fantasy</option>
                                <option value="Drame">Drame</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Couverture URL</label>
                            <input type="url" id="form-couverture" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="form-description" rows="5" required></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel">Annuler</button>
                    <button type="submit" class="btn btn-primary btn-submit">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
